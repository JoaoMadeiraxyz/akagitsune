[package]
name = "realtime-gateway"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
futures-util = "0.3.33"
uuid = { version = "1.24.0", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
